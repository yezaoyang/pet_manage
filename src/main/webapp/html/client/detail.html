<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>商品详情 - 萌宠星球</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script src="/static/js/client/detail.js"></script>
    <link rel="stylesheet" type="text/css" href="/static/css/client/index.css">
    <style>
        /* --- 保持你原有的 CSS 样式不变 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #FFFAF0; color: #404040; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header { background: white; height: 70px; display: flex; align-items: center; border-bottom: 1px solid #eee; }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #6D5A72; font-size: 20px; text-decoration: none; }
        .breadcrumbs { font-size: 14px; color: #888; }
        .breadcrumbs span { margin: 0 8px; color: #ccc; }
        .product-main { display: flex; gap: 50px; margin-top: 30px; background: white; padding: 40px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .product-media { flex: 1; }
        .main-img-box { position: relative; background: #f9f9f9; border-radius: 20px; overflow: hidden; aspect-ratio: 1; }
        .main-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .thumb-list { display: flex; gap: 15px; margin-top: 20px; }
        .thumb-item { width: 70px; height: 70px; border: 2px solid transparent; border-radius: 10px; cursor: pointer; overflow: hidden; background: #f5f5f5; }
        .thumb-item.active { border-color: #FF8C42; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { flex: 1; }
        .product-title { font-size: 28px; font-weight: bold; color: #333; line-height: 1.3; margin-bottom: 15px; }
        .product-desc { font-size: 15px; color: #777; margin-bottom: 25px; line-height: 1.6; }
        .price-box { background: #FFF9F5; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .price-current { font-size: 36px; font-weight: bold; color: #FF8C42; }
        .price-original { color: #aaa; text-decoration: line-through; margin-left: 10px; font-size: 16px; }
        .option-group { margin-bottom: 20px; }
        .option-label { font-size: 14px; font-weight: bold; margin-bottom: 12px; display: block; }
        .quantity-box { display: flex; align-items: center; border: 1px solid #ddd; width: fit-content; border-radius: 6px; overflow: hidden; }
        .qty-btn { width: 35px; height: 35px; background: #f5f5f5; border:none; cursor: pointer; }
        .qty-input { width: 50px; text-align: center; border: none; font-size: 16px; outline: none; background: white;}
        .action-btns { display: flex; gap: 15px; margin-top: 30px; }
        .btn-buy { flex: 4; background: #FF8C42; color: white; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; border:none; cursor: pointer; }
        .btn-cart { flex: 1; border: 1px solid #FF8C42; color: #FF8C42; border-radius: 12px; background: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .detail-tabs { margin-top: 40px; background: white; border-radius: 24px; overflow: hidden; }
        .tab-nav { display: flex; border-bottom: 1px solid #eee; padding: 0 40px; gap: 50px; }
        .tab-item { padding: 25px 0; font-size: 16px; cursor: pointer; position: relative; color: #666; }
        .tab-item.active { color: #FF8C42; font-weight: bold; }
        .tab-item.active::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #FF8C42; }
    </style>
</head>
<body>

<header>
    <div class="container nav-inner">
        <a href="/client/index.html" class="logo">
            <span class="iconify" data-icon="mdi:paw" style="color: #FF8C42; font-size: 28px;"></span>萌宠星球
        </a>
        <div class="breadcrumbs">首页 <span>/</span> <span id="categoryName">分类</span> <span>/</span> 详情</div>
        <a href="/client/loadPage/cart" style="font-size: 24px; color: #666; text-decoration: none;">
            <span class="iconify" data-icon="mdi:cart-outline"></span>
        </a>
    </div>
</header>

<main class="container">
    <section class="product-main">
        <div class="product-media">
            <div class="main-img-box" id="mainImgBox">
                <img id="productImg" src="" alt="商品图"/>
            </div>
            <div class="thumb-list" id="thumbList">
            </div>
        </div>

        <div class="product-info">
            <div class="tags">
                <span class="tag-new">2026 优选正品</span>
                <span class="tag-sales">| 质量保障</span>
            </div>
            <h1 class="product-title" id="productTitle">加载中...</h1>
            <p class="product-desc" id="productDesc">正在努力获取商品详情...</p>

            <div class="price-box">
                <span class="price-current" id="productPrice">¥0.00</span>
                <span class="price-original" id="oldPrice">¥0.00</span>
                <span class="promo-tag">心宠价</span>
            </div>

            <div class="option-group">
                <span class="option-label">购买数量</span>
                <div class="quantity-box">
                    <button class="qty-btn" onclick="updateQty(-1)">-</button>
                    <input type="text" class="qty-input" value="1" id="qtyInput" readonly/>
                    <button class="qty-btn" onclick="updateQty(1)">+</button>
                </div>
            </div>

            <div class="action-btns">
                <button class="btn-buy" onclick="handleQuickBuy()">立即购买</button>
                <button class="btn-cart" onclick="handleAddToCart()">
                    <span class="iconify" data-icon="mdi:cart-plus"></span>
                </button>
            </div>
        </div>
    </section>

    <section class="detail-tabs">
        <div class="tab-nav">
            <div class="tab-item active">商品详情</div>
            <div class="tab-item">产品参数</div>
        </div>
        <div class="tab-content">
            <div id="detailContent" style="text-align: center;">
            </div>
        </div>
    </section>
</main>


</body>
</html>
