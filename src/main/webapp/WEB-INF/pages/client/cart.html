<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>我的购物车 - 萌宠星球</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/static/css/client/index.css">
    <style>
        /* --- 保持你原有的 CSS 样式不变 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #FFFAF0;
            color: #404040;
            padding-bottom: 50px;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header { background: white; height: 70px; display: flex; align-items: center; border-bottom: 1px solid #eee; margin-bottom: 30px; }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #6D5A72; font-size: 20px; text-decoration: none; }
        .cart-title { font-size: 14px; color: #666; }
        .cart-wrapper { display: flex; gap: 30px; align-items: flex-start; }
        .cart-main { flex: 3; }
        .cart-sidebar { flex: 1.2; position: sticky; top: 100px; }
        .promo-banner {
            background: white; padding: 15px 25px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #FFEDD5; margin-bottom: 20px; font-size: 14px;
        }
        .promo-tag { background: #FF8C42; color: white; padding: 2px 8px; border-radius: 4px; margin-right: 10px; font-weight: bold; }
        .promo-link { color: #FF8C42; text-decoration: none; font-weight: bold; }
        .cart-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .store-header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #f5f5f5; }
        .store-name { font-weight: bold; font-size: 16px; color: #333; }
        .cart-item { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #fafafa; padding-bottom: 15px; }
        .item-img { width: 100px; height: 100px; border-radius: 12px; background: #f9f9f9; object-fit: cover; }
        .item-info { flex: 1; }
        .item-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .item-spec { font-size: 12px; color: #999; margin-bottom: 8px; }
        .item-price-qty { display: flex; justify-content: space-between; align-items: center; width: 150px; text-align: right; }
        .price { color: #FF8C42; font-weight: bold; font-size: 18px; margin-bottom: 10px; display: block; }
        .qty-selector { display: flex; border: 1px solid #ddd; border-radius: 5px; overflow: hidden; width: fit-content; margin-left: auto; }
        .qty-btn { width: 25px; height: 25px; background: #f5f5f5; border: none; cursor: pointer; }
        .qty-input { width: 35px; text-align: center; border: none; border-left: 1px solid #ddd; border-right: 1px solid #ddd; font-size: 14px; }
        .summary-card { background: white; border-radius: 25px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .total-price { color: #FF8C42; font-size: 28px; }
        .checkout-btn {
            width: 100%; background: #FF8C42; color: white; border: none;
            padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        .recommend-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
        .recommend-item { background: white; padding: 15px; border-radius: 15px; text-align: center; }
        .recommend-item img { width: 100%; border-radius: 10px; margin-bottom: 10px; aspect-ratio: 1; }
        .pay-btn { flex: 1; border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; font-size: 12px; }
        .pay-btn.active { border-color: #FF8C42; background: #FFF9F5; }
        .payment-methods { display: flex; gap: 10px; margin: 25px 0; }
    </style>
</head>
<body>

<header>
    <div class="container nav-inner">
        <a href="/client/index.html" class="logo">
            <span class="iconify" data-icon="mdi:paw"></span>萌宠星球
        </a>
        <div class="cart-title">我的购物车 (<span id="cartCount">0</span>)</div>
    </div>
</header>

<main class="container">
    <div class="cart-wrapper">
        <div class="cart-main">
            <div class="promo-banner">
                <div><span class="promo-tag">满减</span>全场宠物零食满 ¥299 包邮</div>
                <a href="/client/loadPage/index" class="promo-link">去凑单 ></a>
            </div>

            <div class="cart-card">
                <div class="store-header">
                    <input type="checkbox" id="selectAll">
                    <span class="iconify" data-icon="mdi:store-outline" style="font-size: 20px;"></span>
                    <span class="store-name">萌宠星球自营旗舰店</span>
                </div>

                <div id="cartListContainer">
                    <p style="text-align: center; padding: 50px; color: #999;">正在加载您的购物篮...</p>
                </div>
            </div>
        </div>

        <aside class="cart-sidebar">
            <div class="summary-card">
                <div class="summary-title">订单摘要</div>
                <div class="summary-row" style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <span>商品小计</span>
                    <span id="subtotal">¥0.00</span>
                </div>
                <div class="summary-row" style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <span>运费合计</span>
                    <span style="color: #43A047;">免邮</span>
                </div>
                <div class="summary-row total" style="border-top: 1px solid #eee; padding-top: 20px; margin-top: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                    <span>应付总额</span>
                    <span class="total-price" id="totalPrice">¥0.00</span>
                </div>

                <div style="margin-top: 25px; font-size: 14px; font-weight: bold;">结算方式</div>
                <div class="payment-methods">
                    <div class="pay-btn active" data-type="wechat">
                        <span class="iconify" data-icon="mdi:wechat" style="color: #43A047; font-size: 18px;"></span>微信
                    </div>
                    <div class="pay-btn" data-type="alipay">
                        <span class="iconify" data-icon="mdi:alipay" style="color: #1677FF; font-size: 18px;"></span>支付宝
                    </div>
                </div>

                <button class="checkout-btn" onclick="submitOrder()">立即结账 ></button>
            </div>
        </aside>
    </div>
</main>


</body>
<script src="/static/js/client/cart.js"></script>

</html>
